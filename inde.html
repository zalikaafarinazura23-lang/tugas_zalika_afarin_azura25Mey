<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profil Zalika</title>

  <!-- Icon -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background: linear-gradient(to right, #fbc2eb, #a6c1ee);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .card{
      background:white;
      width:350px;
      border-radius:20px;
      padding:30px;
      text-align:center;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
    }

    .profile-img{
      width:140px;
      height:140px;
      border-radius:50%;
      object-fit:cover;
      border:5px solid #ff69b4;
      margin-bottom:20px;
    }

    h1{
      color:#333;
      margin-bottom:10px;
    }

    h3{
      color:#666;
      margin-bottom:15px;
    }

    p{
      color:#555;
      line-height:1.6;
      margin-bottom:20px;
      font-size:15px;
    }

    .info{
      text-align:left;
      margin-bottom:20px;
    }

    .info p{
      margin:8px 0;
    }

    .social-icons{
      display:flex;
      justify-content:center;
      gap:20px;
      margin-top:15px;
    }

    .social-icons a{
      text-decoration:none;
      color:white;
      background:#ff69b4;
      width:45px;
      height:45px;
      display:flex;
      justify-content:center;
      align-items:center;
      border-radius:50%;
      font-size:20px;
      transition:0.3s;
    }

    .social-icons a:hover{
      background:#6c63ff;
      transform:scale(1.1);
    }

    .btn{
      display:inline-block;
      margin-top:20px;
      padding:10px 25px;
      background:#6c63ff;
      color:white;
      text-decoration:none;
      border-radius:30px;
      transition:0.3s;
    }

    .btn:hover{
      background:#ff69b4;
    }
  </style>
</head>
<body>

  <div class="card">

    <!-- Ganti foto.jpg dengan nama foto kamu -->
    <img src="WhatsApp Image 2026-05-25 at 08.42.56.jpeg" alt="Foto Zalika" class="profile-img">

    <h1>Zalika Afarin Azura</h1>
    <h3>Pelajar RPL</h3>

    <p>
      Halo semuanya! Saya Zalika Afarin Azura, siswi kelas 10
      di SMK Negeri 15 Jakarta jurusan Rekayasa Perangkat Lunak (RPL).
      
    </p>

    <div class="info">
      <p><b>Sekolah:</b> SMK Negeri 15 Jakarta</p>
      <p><b>Jurusan:</b> Rekayasa Perangkat Lunak</p>
      <p><b>Kelas:</b> 10</p>
    </div>

    <div class="social-icons">
      <a href="#"><i class="fa-solid fa-envelope"></i></a>
      <a href="#"><i class="fa-brands fa-tiktok"></i></a>
      <a href="#"><i class="fa-brands fa-instagram"></i></a>
      <a href="#"><i class="fa-brands fa-threads"></i></a>
    </div>

    <a href="#" class="btn">Profile Saya</a>

  </div>

</body>
</html>
